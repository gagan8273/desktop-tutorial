<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="add3.css">
</head>
<body>

  <main class="page-wrapper">
    <section class="form-card">

      <div class="form-header">
        <div class="header-icon">🌀</div>
        <div>
          <p class="eyebrow">Welcome to our portal</p>
          <h1>Student Registration</h1>
          <p class="subtitle">Complete the form below to create your student profile.</p>
        </div>
      </div>

      <form id="registrationform action="#" method="post" enctype="multipart/form-data">

        <div class="section-title">
          <span>01</span>
          <h2>Personal information</h2>
        </div>

        <div class="form-grid">
          <div class="input-group">
            <label for="name">Full name <span>*</span></label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            >
          </div>

          <div class="input-group">
            <label for="age">Age <span>*</span></label>
            <input
              type="number"
              id="age"
              name="age"
              placeholder="Enter your age"
              min="1"
              max="100"
              required
            >
          </div>

          <div class="input-group">
            <label for="state">State <span>*</span></label>
            <select id="state" name="state" required>
              <option value="" selected disabled>Select your state</option>
              <option>Andhra Pradesh</option>
              <option>Arunachal Pradesh</option>
              <option>Assam</option>
              <option>Bihar</option>
              <option>Chhattisgarh</option>
              <option>Delhi</option>
              <option>Goa</option>
              <option>Gujarat</option>
              <option>Haryana</option>
              <option>Himachal Pradesh</option>
              <option>Jharkhand</option>
              <option>Karnataka</option>
              <option>Kerala</option>
              <option>Madhya Pradesh</option>
              <option>Maharashtra</option>
              <option>Manipur</option>
              <option>Tripura</option>
              <option>Uttar Pradesh</option>
              <option>Uttarakhand</option>
              <option>West Bengal</option>
            </select>
          </div>
        </div>

        <div class="section-title">
          <span>02</span>
          <h2>Academic details</h2>
        </div>

        <div class="form-grid">
          <div class="input-group">
            <label for="university">University name <span>*</span></label>
            <input
              type="text"
              id="university"
              name="university"
              placeholder="Enter your university name"
              required
            >
          </div>

          <div class="input-group">
            <label for="college">College name <span>*</span></label>
            <input
              type="text"
              id="college"
              name="college"
              placeholder="Enter your college name"
              required
            >
          </div>

          <div class="input-group">
            <label for="roll-number">Roll number <span>*</span></label>
            <input
              type="text"
              id="roll-number"
              name="roll_number"
              placeholder="Enter your roll number"
              required
            >
          </div>

          <div class="input-group">
            <label for="email">Email address <span>*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="input-group">
            <label for="mobile">Mobile number <span>*</span></label>
            <input
              type="tel"
              id="mobile"
              name="mobile"
              placeholder="+91 98765 43210"
              autocomplete="tel"
              pattern="[0-9+\-\s]{10,}"
              required
            >
          </div>

          <div class="input-group">
            <label>Gender <span>*</span></label>

            <div class="radio-options">
              <label class="radio-card">
                <input type="radio" name="gender" value="Male" required>
                <span>Male</span>
              </label>

              <label class="radio-card">
                <input type="radio" name="gender" value="Female">
                <span>Female</span>
              </label>

              <label class="radio-card">
                <input type="radio" name="gender" value="Prefer not to say">
                <span>Prefer not to say</span>
              </label>
            </div>
          </div>
        </div>

        <div class="section-title">
          <span>03</span>
          <h2>Profile photo</h2>
        </div>

        <div class="upload-box">
          <div class="upload-icon">↑</div>
          <div>
            <label for="photo" class="upload-label">Upload your photo</label>
            <p>PNG, JPG or JPEG. Maximum file size: 2MB</p>
          </div>
          <input
            type="file"
            id="photo"
            name="photo"
            accept=".png,.jpg,.jpeg"
          >
        </div>

        <label class="terms">
          <input type="checkbox" name="terms" required>
          <span>
            I have read and agree to the
            <a href="#">terms and conditions</a>.
          </span>
        </label>

        <div class="form-footer">
          <p><span>*</span> Required fields</p>
          <button type="submit">
            Submit registration
            <span>→</span>
          </button>
        </div>

      </form>
    </section>
  </main>
</body>
</html>
